name: Production (OSS)

# Production OSS path: installs only the supported runtime + dev tools (no [legacy]
# ML stack). This is the workflow intended to gate the run -> report -> compare
# package. The legacy/full benchmark suite lives in `ci.yml` and is not required
# for the production path.

on:
  push:
  pull_request:

jobs:
  production:
    name: production (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install production package (dev extra only, no legacy)
        run: python -m pip install -e .[dev]

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Import smoke
        # The importable package is `model_failure_lab` (the `failure-lab` console
        # script maps to it). There is no top-level `failure_lab` module.
        run: python -c "import model_failure_lab"

  consumer-install:
    # `production` installs with `pip install -e .[dev]`. That is not the path a user
    # takes, and the difference has already shipped one bug (6aa4bc3: a wheel exclude glob
    # swallowed `model_failure_lab.datasets`). This job builds the wheel, installs it into
    # a clean environment, and runs the two things the README leads with.
    name: consumer install (wheel + README quickstart)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install the wheel
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist
          python -m pip install --quiet dist/*.whl

      - name: The wheel ships no legacy module
        # The packaging claim, checked against the artifact rather than the config.
        run: |
          python - <<'PY'
          import glob, re, zipfile
          heavy = re.compile(
              r"^\s*(?:from|import)\s+"
              r"(torch|torchvision|pandas|numpy|sklearn|matplotlib|transformers|wilds|pyarrow|streamlit)\b",
              re.MULTILINE,
          )
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          archive = zipfile.ZipFile(wheel)
          offenders = [
              name
              for name in archive.namelist()
              if name.endswith(".py")
              and heavy.search(archive.read(name).decode("utf-8", "replace"))
          ]
          assert not offenders, f"legacy modules in the wheel: {offenders}"
          print(f"{wheel}: clean")
          PY

      - name: README quickstart (offline)
        # The commands the README opens with, from a clean install.
        run: |
          cd "$(mktemp -d)"
          failure-lab demo
          failure-lab datasets list

      - name: The bundled regression walkthrough
        # `bash examples/regression_demo/run.sh` is the README's headline command and was
        # never executed in CI.
        run: bash examples/regression_demo/run.sh

  regression-gate-action:
    name: regression gate action (dogfood)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No `package:` -- exercise the default install path a consumer gets.
      - name: Gate passes on a non-regressing candidate
        uses: ./
        with:
          baseline: examples/regression_demo/runs/baseline
          candidate: examples/regression_demo/runs/baseline
          root: ${{ runner.temp }}/gate-pass

      - name: Gate detects the demo regression (report-only)
        id: regression
        uses: ./
        with:
          baseline: examples/regression_demo/runs/baseline
          candidate: examples/regression_demo/runs/candidate
          root: ${{ runner.temp }}/gate-fail
          gate: "false"

      - name: Assert the regression was detected
        run: test "${{ steps.regression.outputs.verdict }}" = "regression"

      # The README promises "the job fails on a regression". Detection was dogfooded but
      # blocking never was: the step above runs with gate:false. Assert the failing exit
      # code, which is the contract consumers actually depend on.
      - name: Gate blocks the demo regression
        id: blocking
        continue-on-error: true
        uses: ./
        with:
          baseline: examples/regression_demo/runs/baseline
          candidate: examples/regression_demo/runs/candidate
          root: ${{ runner.temp }}/gate-block

      - name: Assert the gate failed the job
        run: |
          if [ "${{ steps.blocking.outcome }}" != "failure" ]; then
            echo "::error::the gate did not fail the job on a known regression"
            exit 1
          fi

  frontend:
    name: frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        # `server/__tests__/artifactBridge.test.ts` drives the real bridge, which shells
        # into `scripts/query_bridge.py`. Without an engine those cases skip silently, and
        # a silently-skipped test is worse than an absent one.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the engine (for the bridge tests)
        run: python -m pip install --quiet .

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Test
        run: npm run --prefix frontend test:run

      - name: Typecheck + build
        run: npm run --prefix frontend build
