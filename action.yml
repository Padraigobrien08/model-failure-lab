name: "Model Failure Lab regression gate"
description: >-
  Compare a baseline and candidate Failure Lab run and fail the job when the
  candidate regresses. Writes a markdown verdict to the job summary.
branding:
  icon: "alert-triangle"
  color: "red"

inputs:
  baseline:
    description: "Baseline run directory (or canonical run ID under `root`)."
    required: true
  candidate:
    description: "Candidate run directory (or canonical run ID under `root`)."
    required: true
  root:
    description: "Artifact root the comparison artifacts are written under."
    required: false
    default: "."
  package:
    description: >-
      pip requirement to install, e.g. `model-failure-lab==0.10.1`. Use `.` to
      install from the checked-out repository instead of PyPI. The default floors
      the version at the first release with the gate and dev-server-bridge
      hardening; do not lower it below `0.10.1`.
    required: false
    default: "model-failure-lab>=0.10.1"
  gate:
    description: "Fail the job on regression (set to `false` to only report)."
    required: false
    default: "true"

outputs:
  verdict:
    description: "Signal verdict: regression, improvement, neutral, or incompatible."
    value: ${{ steps.compare.outputs.verdict }}

runs:
  using: "composite"
  steps:
    - name: Install Model Failure Lab
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: python -m pip install --quiet "$PACKAGE"

    - name: Compare baseline vs candidate
      id: compare
      shell: bash
      # Inputs are passed through the environment rather than interpolated into the
      # script, so a value cannot break out of the surrounding quotes and inject shell.
      env:
        BASELINE: ${{ inputs.baseline }}
        CANDIDATE: ${{ inputs.candidate }}
        ROOT: ${{ inputs.root }}
        GATE: ${{ inputs.gate }}
      run: |
        set +e
        GATE_FLAG=""
        if [ "$GATE" = "true" ]; then
          GATE_FLAG="--gate"
        fi
        failure-lab compare "$BASELINE" "$CANDIDATE" \
          $GATE_FLAG --format markdown --root "$ROOT" > compare.md
        STATUS=$?
        cat compare.md
        cat compare.md >> "$GITHUB_STEP_SUMMARY"
        # Read the verdict off the "Verdict:" headline only. The metrics table always
        # contains "Regression score"/"Improvement score" rows, so a bare grep would
        # match every comparison.
        if grep -q "Verdict:.*regression" compare.md; then
          echo "verdict=regression" >> "$GITHUB_OUTPUT"
        elif grep -q "Verdict:.*improvement" compare.md; then
          echo "verdict=improvement" >> "$GITHUB_OUTPUT"
        elif grep -q "Verdict:.*incompatible" compare.md; then
          echo "verdict=incompatible" >> "$GITHUB_OUTPUT"
        else
          echo "verdict=neutral" >> "$GITHUB_OUTPUT"
        fi
        exit $STATUS
