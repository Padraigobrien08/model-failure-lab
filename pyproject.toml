[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-failure-lab"
version = "0.16.0"
description = "Local-first evaluation and failure-analysis toolkit for LLM and RAG systems."
readme = "README.md"
requires-python = ">=3.11"
# MIT is published as a PEP 639 SPDX expression -> METADATA "License-Expression: MIT",
# which PyPI displays. A "License :: OSI Approved :: MIT License" classifier is
# intentionally NOT added: setuptools >= 77 rejects a license classifier alongside a
# license expression (PEP 639), which breaks `python -m build`.
license = "MIT"
authors = [
  { name = "Padraig O'Brien" },
]
maintainers = [
  { name = "Padraig O'Brien", email = "padraigobrien00@gmail.com" },
]
keywords = ["llm", "rag", "evaluation", "regression-testing", "prompt-testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML",
]

[project.urls]
Homepage = "https://github.com/Padraigobrien08/model-failure-lab"
Repository = "https://github.com/Padraigobrien08/model-failure-lab"
Issues = "https://github.com/Padraigobrien08/model-failure-lab/issues"

[project.optional-dependencies]
anthropic = [
  "anthropic",
]
dev = [
  "pytest",
  "ruff",
]
legacy = [
  "matplotlib",
  "pandas",
  "pyarrow",
  "scikit-learn",
  "torch",
  "transformers",
  "wilds",
]
openai = [
  "openai>=1.0.0",
]
ui = [
  "streamlit",
]

[project.scripts]
failure-lab = "model_failure_lab.cli:main"
model-failure-lab = "model_failure_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
model_failure_lab = ["datasets/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
# The legacy research surfaces (see docs/legacy.md) are kept in the source tree for
# reference but excluded from wheels: `pip install model-failure-lab` ships only the
# supported run -> report -> compare -> harvest workflow.
#
# That was a claim, not a fact, until 0.12.0: `utils`, `tracking`, `artifact_index` and
# `config` were never listed, and `reporting` was a single package holding both surfaces,
# so setuptools could exclude it whole or not at all. Nineteen modules importing torch /
# pandas / numpy / scikit-learn / matplotlib shipped in the wheel and raised ImportError
# on use. The legacy reporting modules now live in `reporting.legacy`, which is a package
# and can be excluded; `tests/unit/test_wheel_excludes_legacy.py` asserts the whole list
# stays true by walking the built package set.
exclude = [
  "model_failure_lab.models",
  "model_failure_lab.models.*",
  "model_failure_lab.results_ui",
  "model_failure_lab.results_ui.*",
  "model_failure_lab.mitigations",
  "model_failure_lab.mitigations.*",
  "model_failure_lab.perturbations",
  "model_failure_lab.perturbations.*",
  "model_failure_lab.evaluation",
  "model_failure_lab.evaluation.*",
  "model_failure_lab.data",
  "model_failure_lab.data.*",
  "model_failure_lab.runners",
  "model_failure_lab.runners.*",
  "model_failure_lab.reporting.legacy",
  "model_failure_lab.reporting.legacy.*",
  "model_failure_lab.artifact_index",
  "model_failure_lab.artifact_index.*",
  "model_failure_lab.config",
  "model_failure_lab.config.*",
  "model_failure_lab.tracking",
  "model_failure_lab.tracking.*",
  "model_failure_lab.utils",
  "model_failure_lab.utils.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "legacy: test depends on the optional [legacy] ML stack (torch/pandas/numpy/scikit-learn); auto-skipped when it is unavailable.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
